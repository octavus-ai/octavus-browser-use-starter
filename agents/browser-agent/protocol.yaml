# Browser Use Agent Protocol
# An agent that can browse the web, interact with pages, and extract information

# Input - provided when starting the agent
input:
  TASK_DESCRIPTION:
    type: string
    description: Description of the browsing task
    optional: true

# Triggers - how the agent can be invoked
triggers:
  user-message:
    description: User sends a chat message
    input:
      USER_MESSAGE:
        type: string
        description: The user's message

# Tools - browser automation capabilities
# `title` is the label the user sees; `description` is written for the model.
tools:
  browser-navigate:
    display: title
    title: Opening a page
    description: Navigate the browser to a URL and return the page title, final URL, and HTTP status.
    parameters:
      url:
        type: string
        description: The URL to navigate to

  browser-click:
    display: title
    title: Clicking
    description: Click the element matching a CSS selector on the current page.
    parameters:
      selector:
        type: string
        description: CSS selector of the element to click

  browser-fill:
    display: title
    title: Filling a field
    description: Type a value into the form field matching a CSS selector, replacing its current value.
    parameters:
      selector:
        type: string
        description: CSS selector of the input field
      value:
        type: string
        description: Value to enter in the field

  browser-get-text:
    display: title
    title: Reading the page
    description: Extract the visible text of the current page, or of one element, truncated to 5000 characters.
    parameters:
      selector:
        type: string
        optional: true
        description: CSS selector to extract from (extracts all visible text if omitted)

  browser-get-html:
    display: title
    title: Inspecting the page
    description: Get the structure of the current page - headings, links, buttons, forms, and inputs - to find selectors to act on.
    parameters:
      selector:
        type: string
        optional: true
        description: CSS selector to scope extraction (extracts from full page if omitted)

# Skills - built-in Octavus capabilities
skills:
  screenshot:
    display: title
    title: Taking a screenshot

# Agent configuration
agent:
  model: anthropic/claude-sonnet-5-5
  system: system
  input:
    - TASK_DESCRIPTION
  tools:
    - browser-navigate
    - browser-click
    - browser-fill
    - browser-get-text
    - browser-get-html
  skills:
    - screenshot
  agentic: true
  maxSteps: 20
  thinking: medium

# Handlers - what happens when triggers fire
handlers:
  user-message:
    Add user message:
      block: add-message
      role: user
      prompt: user-message
      input:
        - USER_MESSAGE
      display: hidden

    Respond to user:
      block: next-message
